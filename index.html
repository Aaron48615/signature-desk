<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1ebda" />
    <title>Signature Desk</title>
  </head>
  <body>
    <main>
      <div class="heading">
        <div class="studio-title">
          <div class="stationery-art" aria-hidden="true"></div>
          <h1>签字板</h1>
        </div>
        <div class="heading-tools">
          <button id="language" class="language" type="button">
            <i data-icon="globe"></i><span lang="en">EN</span><b aria-hidden="true">/</b
            ><span lang="zh-CN">中文</span>
          </button>
          <div class="mode" aria-label="书写模式">
            <button id="regular" aria-pressed="true"><i data-icon="pen"></i>常规签名</button
            ><button id="direct" aria-pressed="false"><i data-icon="pad"></i>触板直写</button>
          </div>
        </div>
      </div>
      <div class="columns">
        <section class="work">
          <div class="sheet">
            <div class="pens">
              <div class="pen-group">
                <span class="label">笔色</span>
                <div id="palette" class="palette"></div>
                <label class="colour custom" title="自定义笔色"
                  ><span>＋</span
                  ><input type="color" id="ink" value="#282823" aria-label="自定义笔色"
                /></label>
              </div>
              <div class="thickness">
                <label class="label" for="weight">粗细</label
                ><input id="weight" type="range" min="1" max="24" step="0.5" value="4" /><output
                  id="weightText"
                  >4 px</output
                >
              </div>
              <label class="nib-option" title="快速书写保留线宽，轻快提笔时短距离收锋。"
                ><input id="naturalNib" type="checkbox" />自然笔锋</label
              >
            </div>
            <div class="mat">
              <div id="paper">
                <canvas id="board" aria-label="签名画板"></canvas>
                <div id="guide" aria-hidden="true">
                  <span>在此签名</span>
                  <div></div>
                </div>

                <div id="touchMarker" aria-hidden="true" hidden></div>
              </div>
            </div>
            <div class="sheet-foot" id="sheetFoot">
              <span class="measure"><i data-icon="corners"></i><span id="boardSize"></span></span>
              <div class="actions">
                <button id="undo" title="撤销（⌘/Ctrl Z）" aria-label="撤销">
                  <i data-icon="undo"></i></button
                ><button id="redo" title="重做" aria-label="重做"><i data-icon="redo"></i></button
                ><b></b
                ><button id="clear" title="清空画板" aria-label="清空画板">
                  <i data-icon="trash"></i>
                </button>
              </div>
            </div>
          </div>
          <details id="sizeTools">
            <summary><i data-icon="ruler"></i>画板尺寸<span class="chevron">⌄</span></summary>
            <div class="settings">
              <label>宽度<input id="boardW" type="number" min="1" max="8192" value="1200" /></label
              ><span>×</span
              ><label>高度<input id="boardH" type="number" min="1" max="8192" value="640" /></label
              ><button id="applySize">应用尺寸</button><button id="resetSize">重置尺寸</button>
            </div>
          </details>
        </section>
        <aside id="exportSidebar">
          <section class="export">
            <h2><i data-icon="image"></i>导出设置</h2>
            <div class="preview"><canvas id="preview" aria-label="最终 PNG 预览"></canvas></div>
            <div class="preview-meta"><span>PNG 预览</span><span id="previewSize"></span></div>
            <hr />
            <fieldset>
              <legend>背景</legend>
              <div class="bg-options">
                <button data-bg="transparent" aria-pressed="true">
                  <span class="chip check"></span>透明</button
                ><button data-bg="white" aria-pressed="false">
                  <span class="chip white"></span>白色</button
                ><label id="bgCustomLabel" class="background-custom"
                  ><span class="chip multi"></span>自定义<input
                    aria-label="自定义背景色"
                    type="color"
                    value="#f4e7d0"
                    id="bgCustom"
                /></label>
              </div>
            </fieldset>
            <div class="output-head">
              <label for="outW">导出尺寸</label
              ><button id="lock" title="锁定宽高比" aria-label="锁定宽高比" aria-pressed="true">
                <i data-icon="link"></i>
              </button>
            </div>
            <div class="dimensions">
              <label
                ><small>宽</small
                ><input id="outW" type="number" min="1" max="8192" aria-label="导出宽度" /></label
              ><span>×</span
              ><label
                ><small>高</small
                ><input id="outH" type="number" min="1" max="8192" aria-label="导出高度" /></label
              ><small>px</small>
            </div>
            <button id="export" class="primary"><i data-icon="download"></i>直接导出 PNG</button>
            <button id="process" class="secondary-export">
              <i data-icon="sliders"></i>处理后导出
            </button>
          </section>
          <div class="note">
            <i data-icon="pen"></i>
            <div>
              <p id="status" role="status" aria-live="polite"></p>
              <div id="captureHint" class="capture-hint" hidden>
                触板直写中<output id="touchPosition" hidden></output
                ><span><kbd>Esc</kbd> 结束直写</span>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </main>
    <dialog id="processDialog" aria-labelledby="processTitle">
      <header class="process-head">
        <h2 id="processTitle">处理后导出</h2>
        <button id="processClose" aria-label="关闭" title="关闭">×</button>
      </header>
      <div class="process-layout">
        <div class="process-mat" id="processMat">
          <div id="processPaper">
            <canvas id="processCanvas" aria-label="PNG 编辑预览"></canvas>
            <div id="cropBox" hidden></div>
          </div>
        </div>
        <div class="process-tools" id="processTools">
          <h3>裁剪</h3>
          <button id="manualCrop" aria-pressed="false"><i data-icon="crop"></i>框选裁剪</button>
          <label class="edit-field"
            >留白<span
              ><input id="padding" type="number" min="0" max="512" value="24" /> px</span
            ></label
          ><button id="trim">裁去空白</button>
          <h3>旋转与翻转</h3>
          <div class="angle-row">
            <label class="edit-field"
              >角度<span
                ><input id="angle" type="number" min="-360" max="360" step="any" value="90" />
                °</span
              ></label
            ><button id="rotate">旋转</button>
          </div>
          <div class="flip-row">
            <button id="flipX">水平翻转</button><button id="flipY">垂直翻转</button>
          </div>
          <div class="process-history">
            <button id="editUndo" title="撤销" aria-label="撤销"><i data-icon="undo"></i></button
            ><button id="editRedo" title="重做" aria-label="重做"><i data-icon="redo"></i></button
            ><output id="processSize"></output>
          </div>
        </div>
      </div>
      <footer class="process-foot">
        <p id="processStatus" role="status"></p>
        <button id="saveProcessed" class="primary"><i data-icon="download"></i>保存 PNG</button>
      </footer>
    </dialog>
    <dialog id="dialog" aria-labelledby="dialogTitle">
      <form method="dialog">
        <h2 id="dialogTitle"></h2>
        <p id="dialogBody"></p>
        <div id="deviceSettings" hidden>
          <label>触控板<select id="devices"></select></label>
          <div id="calibration" hidden>
            <p>请输入触控板的实际尺寸（毫米）。</p>
            <div class="settings">
              <label>宽<input id="padW" type="number" min="1" max="1000" /></label
              ><label>高<input id="padH" type="number" min="1" max="1000" /></label>
            </div>
          </div>
          <label class="position-option"
            ><input id="showPosition" type="checkbox" />显示触点位置</label
          >
          <details id="edgeOptions">
            <summary>边缘校准<span class="chevron">⌄</span></summary>
            <div class="edge-settings">
              <p>填入手指抵达各边时的原始读数（%）。仅在本次窗口生效。</p>
              <div class="edge-grid">
                <label
                  >左<input id="edge-left" type="number" min="-10" max="10" step="0.01" value="0"
                /></label>
                <label
                  >右<input
                    id="edge-right"
                    type="number"
                    min="90"
                    max="110"
                    step="0.01"
                    value="100"
                /></label>
                <label
                  >上<input id="edge-top" type="number" min="-10" max="10" step="0.01" value="0"
                /></label>
                <label
                  >下<input
                    id="edge-bottom"
                    type="number"
                    min="90"
                    max="110"
                    step="0.01"
                    value="100"
                /></label>
              </div>
              <button type="button" id="resetEdges">恢复默认范围</button>
            </div>
          </details>
          <p id="deviceState"></p>
        </div>
        <div class="dialog-actions">
          <button value="cancel" id="cancelDialog">取消</button
          ><button value="ok" id="okDialog" class="primary">确定</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
