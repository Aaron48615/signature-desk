name: Build Windows and Ubuntu packages
on: workflow_dispatch

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: Signature-Desk-Ubuntu-amd64.deb
          - os: windows-2022
            asset: Signature-Desk-Windows-x64-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libudev-dev patchelf xvfb xauth
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --features custom-protocol
      - name: Check packaged Linux application
        if: runner.os == 'Linux'
        run: |
          dpkg-deb -x "release/${{ matrix.asset }}" "$RUNNER_TEMP/ink-app"
          xvfb-run -a dbus-run-session -- "$RUNNER_TEMP/ink-app/usr/bin/signature-desk" --check-ui
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error
